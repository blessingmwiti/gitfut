# nginx vhost for the self-hosted GitFut fork.
#
# Apply with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gitfut.blessingmwiti.com
#   sudo ln -s /etc/nginx/sites-available/gitfut.blessingmwiti.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gitfut.blessingmwiti.com --redirect
#
# certbot --nginx rewrites this file to add the `listen 443 ssl` block, the
# certificates under /etc/letsencrypt/live/, and the HTTP→HTTPS redirect.
# The upstream Next.js container listens on 127.0.0.1:3100.

server {
    listen 80;
    listen [::]:80;
    server_name gitfut.blessingmwiti.com;

    access_log /var/log/nginx/gitfut.access.log;
    error_log  /var/log/nginx/gitfut.error.log;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
