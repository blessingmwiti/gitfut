# nginx vhost for the self-hosted GitFut fork.
#
# This deployment sits behind Cloudflare (proxied / orange cloud, SSL mode
# "Full"), so nginx presents an ORIGIN certificate and Cloudflare serves the
# public one. The origin certificate used here is self-signed:
#
#   sudo mkdir -p /etc/nginx/ssl/gitfut
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -keyout /etc/nginx/ssl/gitfut/privkey.pem \
#     -out /etc/nginx/ssl/gitfut/fullchain.pem \
#     -subj "/CN=gitfut.blessingmwiti.com" \
#     -addext "subjectAltName=DNS:gitfut.blessingmwiti.com"
#   sudo chmod 600 /etc/nginx/ssl/gitfut/privkey.pem
#
# "Full" accepts a self-signed origin cert; "Full (strict)" does not. To use
# Full (strict), replace this with a Cloudflare Origin CA certificate
# (Cloudflare dashboard → SSL/TLS → Origin Server) or a publicly trusted cert.
# Note that Let's Encrypt HTTP-01 is awkward while proxied (Cloudflare redirects
# HTTP to HTTPS before the request reaches the origin) — use DNS-01, or issue
# while the record is temporarily DNS-only.
#
# Apply:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gitfut.blessingmwiti.com
#   sudo ln -sf /etc/nginx/sites-available/gitfut.blessingmwiti.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Next.js container listens on 127.0.0.1:3100 (see docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name gitfut.blessingmwiti.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gitfut.blessingmwiti.com;

    ssl_certificate     /etc/nginx/ssl/gitfut/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gitfut/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gitfut_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/gitfut.access.log;
    error_log  /var/log/nginx/gitfut.error.log;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
